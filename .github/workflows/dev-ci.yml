# .github/workflows/ci.yml
name: Manifests CI
on:
  pull_request: { branches: [dev] }
  push: { branches: [dev] }

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  validate:
    uses: nishanau/ci-cd-templates/.github/workflows/ci-manifests.yml@main
    with:
      overlay_path: manifests/overlays/dev
      tools_ref: "latest"                 # Better: pin to a known digest
      policies_path: policy
      kubeconform_flags: "--strict --ignore-missing-schemas"
      fail_on_warn: false
    secrets: inherit
