# =====================================================================
#  Workflow: Dev CI (App + Manifests + GitOps Bump)
#  ---------------------------------------------------------------------
#  Purpose:
#    - Run App CI when app code or config changes
#    - Run Manifests CI when infra YAML/policy changes
#    - Bump GitOps repo tag only if BOTH succeed
#    - Keeps builds efficient by skipping unnecessary jobs
# =====================================================================

name: Dev CI (App + Manifests + GitOps Bump)

on:
  push:                                # Trigger workflow when code is pushed
    branches: [dev, stage, master]             # Only run on pushes to these branches
    paths:                             # Restrict trigger to specific file changes
      # Application files (trigger App CI)
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'next.config.mjs'
      - 'eslint.config.mjs'
      - 'jsconfig.json'
      - 'tsconfig.json'

      # Kubernetes manifests & policies (trigger Manifests CI)
      - 'manifests/**'
      - 'policy/**'

      # CI configuration
      - '.github/workflows/dev-ci.yml'

# ---------------------------------------------------------------------
#  Permissions
# ---------------------------------------------------------------------
permissions:
  contents: write                      # Needed for committing tag bumps
  packages: write                      # Push images to registry
  security-events: write               # Upload Trivy scan results (SARIF)

# =====================================================================
#  JOB 1: APP CI - Build, Test, Scan, and Push Docker Image
# =====================================================================
jobs:
  app-ci:
    # Run only if app-related files changed
    if: ${{ github.ref_name == 'dev' && (
             contains(join(github.event.commits.*.modified), 'src/') ||
             contains(join(github.event.commits.*.modified), 'public/') ||
             contains(join(github.event.commits.*.modified), 'package.json') ||
             contains(join(github.event.commits.*.modified), 'package-lock.json') ||
             contains(join(github.event.commits.*.modified), 'Dockerfile') ||
             contains(join(github.event.commits.*.modified), '.dockerignore') ||
             contains(join(github.event.commits.*.modified), 'next.config.mjs') ||
             contains(join(github.event.commits.*.modified), 'eslint.config.mjs') ||
             contains(join(github.event.commits.*.modified), 'jsconfig.json') ||
             contains(join(github.event.commits.*.modified), 'tsconfig.json')
           ) }}
    uses: nishanau/ci-cd-templates/.github/workflows/ci-app.yml@main
    with:
      image_name: nishans0/next-portfolio       # Docker image name (Docker Hub)
      context: .                                # Build context (root)
      dockerfile: ./Dockerfile                  # Path to Dockerfile
      push_image: true                          # Push built image to registry
      run_tests: true                           # Run defined tests
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

# =====================================================================
#  JOB 2: MANIFESTS CI - Validate YAML and Policies
# =====================================================================
  manifests-ci:
    # Run only if Kubernetes manifests or policies changed
    if: ${{ github.event_name == 'push' && (
             contains(join(github.event.commits.*.modified), 'manifests/') ||
             contains(join(github.event.commits.*.modified), 'policy/')
           ) }}
    uses: nishanau/ci-cd-templates/.github/workflows/ci-manifests.yml@main
    with:
      overlay_path: manifests/overlays/${{ github.ref_name }}
      tools_ref: "latest"
      policies_path: policy
      kubeconform_flags: "--strict --ignore-missing-schemas"
      fail_on_warn: false
    secrets: inherit

# =====================================================================
#  JOB 3A: RESOLVE IMAGE TAG
# =====================================================================
  resolve-tag:
    runs-on: ubuntu-latest
    needs: [app-ci, manifests-ci]
    if: ${{ always() && (
      (github.ref_name == 'dev' && needs.app-ci.result == 'success') ||
      (
        github.ref_name != 'dev' &&
        ( !contains(needs.*, 'app-ci') || needs.app-ci.result == 'success' || needs.app-ci.result == 'skipped' ) &&
        (needs.manifests-ci.result == 'success' || needs.manifests-ci.result == 'skipped')
      )) }}
    steps:
      - uses: actions/checkout@v4
  
      - id: resolve_tag
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            TAG="sha-${{ github.sha }}"
          elif [[ "${{ github.ref_name }}" == "stage" ]]; then
            TAG=$(yq e '.images[] | select(.name=="nishans0/next-portfolio") | .newTag' manifests/overlays/dev/kustomization.yaml)
          elif [[ "${{ github.ref_name }}" == "prod" ]]; then
            TAG=$(yq e '.images[] | select(.name=="nishans0/next-portfolio") | .newTag' manifests/overlays/stage/kustomization.yaml)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
  
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}

# =====================================================================
#  JOB 3B: GITOPS BUMP - Update Image Tag in GitOps Repo
# =====================================================================
  bump-gitops:
    needs: [app-ci, manifests-ci, resolve-tag]
    if: ${{ always() && (
      (github.ref_name == 'dev' && needs.app-ci.result == 'success') ||
      (
        github.ref_name != 'dev' &&
        ( !contains(needs.*, 'app-ci') || needs.app-ci.result == 'success' || needs.app-ci.result == 'skipped' ) &&
        (needs.manifests-ci.result == 'success' || needs.manifests-ci.result == 'skipped')
      )) }}
    uses: nishanau/ci-cd-templates/.github/workflows/ci-gitops-bump.yml@main
    with:
      gitops_repo: nishanau/NextJSPortfolioSite
      gitops_path: manifests/overlays/${{ github.ref_name }}/kustomization.yaml
      image_name: nishans0/next-portfolio
      image_tag: ${{ needs.resolve-tag.outputs.tag }}
      gitops_pat: ${{ secrets.GITOPS_PAT }}
