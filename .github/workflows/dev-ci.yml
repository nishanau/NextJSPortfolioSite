# ==========================================================
# CI - Dev (SHA tag + GitOps update) with caching + official actions
# ==========================================================
name: CI - Dev (SHA tag + GitOps update)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

env:
  IMAGE_NAME: nishans0/next-portfolio                  # docker repo
  KUSTOMIZE_DIR: manifests/overlays/dev               # dev overlay
  IMAGE_TAG: sha-${{ github.sha }}                    # immutable tag
  DEV_NS: dev
  BIN_DIR: ${{ runner.temp }}/bin                     # cacheable tool dir
  # Pin tool versions to avoid "latest" churn
  CONFTEST_VER: v0.56.0
  KUBECONFORM_VER: v0.6.7
  YQ_VER: v4.44.3
  KUBE_SCORE_VER: v1.18.0

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_and_update:
    name: Build, Validate, Push, and GitOps Bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2) kubeconfig (plain-text secret: remove base64 -d; base64 secret: keep it)
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # 3) Official actions hit toolcache, not GitHub API
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Setup Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          cache: true
        continue-on-error: true  # we only set up here; scan happens later

      # 4) Minimal apt (no GH API calls)
      - name: Install basic packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq yamllint

      # 5) Cache custom binaries (kubeconform, conftest, yq, kube-score)
      - name: Restore tool cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BIN_DIR }}
          key: tools-${{ runner.os }}-${{ env.KUBECONFORM_VER }}-${{ env.CONFTEST_VER }}-${{ env.YQ_VER }}-${{ env.KUBE_SCORE_VER }}

      - name: Ensure BIN_DIR on PATH
        run: echo "${{ env.BIN_DIR }}" >> $GITHUB_PATH

      # 6) Install pinned tools only on cache miss (no API, pinned URLs)
      - name: Install kubeconform (if missing)
        run: |
          set -e
          mkdir -p "$BIN_DIR"
          if [ ! -x "$BIN_DIR/kubeconform" ]; then
            curl -fL --retry 5 --retry-all-errors \
              -o /tmp/kc.tgz \
              https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VER}/kubeconform-linux-amd64.tar.gz
            tar -xzf /tmp/kc.tgz -C "$BIN_DIR"
            chmod +x "$BIN_DIR/kubeconform"
          fi
          kubeconform -v

      - name: Install conftest (if missing)
        run: |
          set -e
          if [ ! -x "$BIN_DIR/conftest" ]; then
            curl -fL --retry 5 --retry-all-errors \
              -o /tmp/ct.tgz \
              https://github.com/open-policy-agent/conftest/releases/download/${CONFTEST_VER}/conftest_Linux_x86_64.tar.gz
            tar -xzf /tmp/ct.tgz -C "$BIN_DIR"
            chmod +x "$BIN_DIR/conftest"
          fi
          conftest --version

      - name: Install yq (if missing)
        run: |
          set -e
          if [ ! -x "$BIN_DIR/yq" ]; then
            curl -fL --retry 5 --retry-all-errors \
              -o "$BIN_DIR/yq" \
              https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64
            chmod +x "$BIN_DIR/yq"
          fi
          yq --version

      - name: Install kube-score (if missing)
        run: |
          set -e
          if [ ! -x "$BIN_DIR/kube-score" ]; then
            curl -fL --retry 5 --retry-all-errors \
              -o "$BIN_DIR/kube-score" \
              https://github.com/zegl/kube-score/releases/download/${KUBE_SCORE_VER}/kube-score_ubuntu_amd64
            chmod +x "$BIN_DIR/kube-score"
          fi
          kube-score version || true

      # 7) YAML lint
      - name: Lint YAML
        run: yamllint -d relaxed $KUSTOMIZE_DIR

      # 8) Kustomize: prefer pinned binary via GitHub release is messy; use go-getter script once and cache
      - name: Install kustomize (cached)
        run: |
          set -e
          if [ ! -x "$BIN_DIR/kustomize" ]; then
            curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
            mv kustomize "$BIN_DIR/kustomize"
            chmod +x "$BIN_DIR/kustomize"
          fi
          kustomize version

      # 9) Schema validation
      - name: kubeconform
        run: |
          kustomize build $KUSTOMIZE_DIR | kubeconform --strict --ignore-missing-schemas

      # 10) Policy checks
      - name: conftest
        run: conftest test $KUSTOMIZE_DIR

      # 11) Best-practice scan
      - name: kube-score
        run: kube-score score --ignore-test pod-networkpolicy --output-format ci $KUSTOMIZE_DIR || true

      # 12) Build image
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      # 13) Security scan (official action)
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      # 14) Push image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:edge
          docker push $IMAGE_NAME:edge

      # 15) Server dry-run apply
      - name: Server-side dry-run
        run: kustomize build $KUSTOMIZE_DIR | kubectl apply --dry-run=server -f -

      # 16) GitOps bump (commit newTag → Argo CD auto-sync)
      - name: Update dev overlay image tag
        if: ${{ github.event_name == 'push' }}
        run: |
          yq -i '
            (.images[] | select(.name == "'"$IMAGE_NAME"'") | .newTag) = "'"$IMAGE_TAG"'"
          ' $KUSTOMIZE_DIR/kustomization.yaml
          grep -A2 "images:" $KUSTOMIZE_DIR/kustomization.yaml || true

      - name: Commit and push tag update
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add $KUSTOMIZE_DIR/kustomization.yaml
          git commit -m "ci: bump dev image to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:dev
