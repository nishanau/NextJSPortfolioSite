# =====================================================================
#  Workflow: Dev CI (App + Manifests + GitOps Bump)
#  ---------------------------------------------------------------------
#  Purpose:
#    - Run App CI when app code/config changes
#    - Run Manifests CI when infra YAML/policy changes
#    - Bump image tag in manifests when both succeed
# =====================================================================

name: Dev CI (App + Manifests + GitOps Bump)

on:
  push:
    branches: [ "dev", "stage", "prod" ]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.mjs"
      - "eslint.config.mjs"
      - "jsconfig.json"
      - "tsconfig.json"
      - "manifests/**"
      - "policy/**"
      - ".github/workflows/dev-ci.yml"
      
  pull_request:
    branches: [ "stage", "prod" ]
    paths:
      - "manifests/**"
      - "policy/**"
      - ".github/workflows/**"

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  # =====================================================================
  #  JOB 0: DETECT CHANGED FILES
  # =====================================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      manifests: ${{ steps.filter.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'next.config.mjs'
              - 'eslint.config.mjs'
              - 'jsconfig.json'
              - 'tsconfig.json'
            manifests:
              - 'manifests/**'
              - 'policy/**'

  # =====================================================================
  #  JOB 1: RESOLVE TARGET BRANCH (Unified for Push + PR)
  # =====================================================================
  resolve-branch:
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.resolve.outputs.target_branch }}
    steps:
      - id: resolve
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          echo "Resolved target branch: $TARGET_BRANCH"
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

  # =====================================================================
  #  JOB 2: APP CI (only dev)
  # =====================================================================
  app-ci:
    needs: [changes, resolve-branch]
    if: ${{ needs.changes.outputs.app == 'true' && needs.resolve-branch.outputs.target_branch == 'dev' }}
    uses: nishanau/ci-cd-templates/.github/workflows/ci-app.yml@main
    with:
      image_name: nishans0/next-portfolio
      context: .
      dockerfile: ./Dockerfile
      push_image: true
      run_tests: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # =====================================================================
  #  JOB 3: MANIFESTS CI
  # =====================================================================
  manifests-ci:
    needs: [changes, resolve-branch]
    if: ${{ needs.changes.outputs.manifests == 'true' }}
    uses: nishanau/ci-cd-templates/.github/workflows/ci-manifests.yml@main
    with:
      overlay_path: manifests/overlays/${{ needs.resolve-branch.outputs.target_branch }}
      tools_ref: "latest"
      policies_path: policy
      kubeconform_flags: "--strict --ignore-missing-schemas"
      fail_on_warn: false
    secrets: inherit

  # =====================================================================
  #  JOB 4: RESOLVE IMAGE TAG
  # =====================================================================
  resolve-tag:
    runs-on: ubuntu-latest
    needs: [app-ci, manifests-ci, resolve-branch]
    if: ${{ always() && (
      (needs.resolve-branch.outputs.target_branch == 'dev' && needs.app-ci.result == 'success') ||
      (
        needs.resolve-branch.outputs.target_branch != 'dev' &&
        (needs.app-ci.result == 'success' || needs.app-ci.result == 'skipped' || needs.app-ci.result == '') &&
        (needs.manifests-ci.result == 'success' || needs.manifests-ci.result == 'skipped')
      )) }}
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve_tag
        run: |
          TARGET_BRANCH="${{ needs.resolve-branch.outputs.target_branch }}"
          if [[ "$TARGET_BRANCH" == "dev" ]]; then
            TAG="sha-${{ github.sha }}"
          elif [[ "$TARGET_BRANCH" == "stage" ]]; then
            TAG=$(yq e '.images[] | select(.name=="docker.io/nishans0/next-portfolio") | .newTag' manifests/overlays/dev/kustomization.yaml)
          elif [[ "$TARGET_BRANCH" == "prod" || "$TARGET_BRANCH" == "master" ]]; then
            TAG=$(yq e '.images[] | select(.name=="docker.io/nishans0/next-portfolio") | .newTag' manifests/overlays/stage/kustomization.yaml)
          else
            echo "Unknown branch: $TARGET_BRANCH" && exit 1
          fi
          echo "Resolved TAG=$TAG for $TARGET_BRANCH"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # =====================================================================
  #  JOB 5: GITOPS BUMP
  # =====================================================================
  bump-gitops:
    needs: [app-ci, manifests-ci, resolve-tag, resolve-branch]
    if: ${{ github.event_name == 'push' && (
      (needs.resolve-branch.outputs.target_branch == 'dev' && needs.app-ci.result == 'success') ||
      (
        needs.resolve-branch.outputs.target_branch != 'dev' &&
        (needs.app-ci.result == 'success' || needs.app-ci.result == 'skipped' || needs.app-ci.result == '') &&
        (needs.manifests-ci.result == 'success' || needs.manifests-ci.result == 'skipped')
      )) }}
    uses: nishanau/ci-cd-templates/.github/workflows/ci-gitops-bump.yml@main
    with:
      gitops_repo: nishanau/NextJSPortfolioSite
      gitops_path: manifests/overlays/${{ needs.resolve-branch.outputs.target_branch }}/kustomization.yaml
      image_name: docker.io/nishans0/next-portfolio
      image_tag: ${{ needs.resolve-tag.outputs.tag }}
    secrets:
      gitops_pat: ${{ secrets.GITOPS_PAT }}
