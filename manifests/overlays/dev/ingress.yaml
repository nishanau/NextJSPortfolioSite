---
# checkov:skip=CKV_K8S_21 "Namespace will be injected by Argo CD overlay"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: next-portfolio
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: portfolio-dev.nishdevops.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: next-portfolio
                port:
                  number: 80
